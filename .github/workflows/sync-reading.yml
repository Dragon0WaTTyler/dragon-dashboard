name: Sync Reading Feeds

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: sync-reading
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      DRAGON_READING_SYNC_EXTRACT_FULL_CONTENT: "1"
      DRAGON_READING_SYNC_EXTRACT_MAX_ARTICLES: "6"
      DRAGON_READING_SYNC_EXTRACT_TIMEOUT_SECONDS: "12"
      DRAGON_READING_SYNC_EXTRACT_FAILURE_RETRY_HOURS: "24"
      DRAGON_READING_SYNC_EXTRACT_SLOW_LOG_LIMIT: "5"
      DRAGON_READING_SYNC_BACKFILL_BBC: "1"
      DRAGON_READING_SYNC_BBC_BACKFILL_MAX: "12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync reading feeds
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting Reading sync at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python -u scripts/sync_reading_feeds.py

      - name: Reading sync diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Reading sync diagnostics at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git status --short -- reading_data.json || true

      - name: Commit updated reading data
        id: commit_reading_data
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- reading_data.json)" ]; then
            echo "No reading_data.json changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading_data.json
          git commit -m "Sync reading feeds"

          git pull origin main --rebase
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Notify PythonAnywhere reading snapshot refresh
        if: success() && steps.commit_reading_data.outputs.pushed == 'true'
        shell: bash
        env:
          DRAGON_GITHUB_WEBHOOK_SECRET: ${{ secrets.DRAGON_GITHUB_WEBHOOK_SECRET }}
        run: |
          set +e
          if [ -z "${DRAGON_GITHUB_WEBHOOK_SECRET:-}" ]; then
            echo "PythonAnywhere notify skipped: DRAGON_GITHUB_WEBHOOK_SECRET is not configured in GitHub secrets."
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/dragon-reading-notify-response.txt -w "%{http_code}" \
            -X POST "https://dragon99.pythonanywhere.com/reading/github-snapshot-updated" \
            -H "X-Dragon-GitHub-Secret: ${DRAGON_GITHUB_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "PythonAnywhere notify failed with HTTP $http_code"
            cat /tmp/dragon-reading-notify-response.txt || true
            exit 0
          fi
          echo "PythonAnywhere notify succeeded with HTTP $http_code"
          cat /tmp/dragon-reading-notify-response.txt || true
