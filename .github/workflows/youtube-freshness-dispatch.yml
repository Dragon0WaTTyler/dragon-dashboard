name: YouTube Freshness Dispatch

"on":
  workflow_dispatch:
    inputs:
      scope:
        description: "Optional PocketTube scope"
        required: false
        default: ""
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  youtube-freshness-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: youtube-freshness-dispatch
      cancel-in-progress: false

    env:
      YOUTUBE_FRESHNESS_SCOPE: ${{ github.event.inputs.scope || '' }}
      DRAGON_GITHUB_WEBHOOK_SECRET: ${{ secrets.DRAGON_GITHUB_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Sync YouTube freshness
        id: sync
        shell: bash
        run: |
          set +e
          python -u scripts/sync_youtube_freshness.py --scope "${YOUTUBE_FRESHNESS_SCOPE:-}"
          status_code=$?
          if [ "$status_code" -eq 0 ]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Diagnostics
        shell: bash
        run: |
          git status --short -- cache/youtube_latest_snapshot.json cache/youtube_latest_sync_status.json
          ls -lh cache/youtube_latest_snapshot.json cache/youtube_latest_sync_status.json 2>/dev/null || true

      - name: Commit cache changes
        if: ${{ steps.sync.outcome == 'success' }}
        shell: bash
        run: |
          set -e

          if [ ! -f cache/youtube_latest_snapshot.json ] || [ ! -f cache/youtube_latest_sync_status.json ]; then
            echo "YouTube freshness cache files were not created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f cache/youtube_latest_snapshot.json cache/youtube_latest_sync_status.json

          if git diff --cached --quiet -- cache/youtube_latest_snapshot.json cache/youtube_latest_sync_status.json; then
            echo "No staged cache changes to commit."
            exit 0
          fi

          git commit -m "Update YouTube freshness cache"
          git pull origin main --rebase
          git push origin main

      - name: Notify PythonAnywhere
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          status="${{ steps.sync.outputs.status }}"
          if [ -z "$status" ]; then
            status="failed"
          fi

          run_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"

          payload=$(printf '{"status":"%s","scope":"%s","run_id":"%s","run_url":"%s"}' \
            "$status" \
            "${YOUTUBE_FRESHNESS_SCOPE:-}" \
            "${GITHUB_RUN_ID:-}" \
            "$run_url")

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Dragon-GitHub-Secret: ${DRAGON_GITHUB_WEBHOOK_SECRET}" \
            --data "$payload" \
            "https://dragon99.pythonanywhere.com/pockettube/freshness/github-snapshot-updated" || true

